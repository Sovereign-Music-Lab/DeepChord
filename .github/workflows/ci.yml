name: Cross-platform tests and public-package audit
on: [push, pull_request]
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install . build
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_public.py
      - run: python scripts/check_site.py
      - run: deepchord demo --out .private/ci-demo
      - run: deepchord foundation --out .private/ci-foundation
      - run: deepchord chord Cdim7
      - run: python -m build
