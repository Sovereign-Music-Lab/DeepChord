[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-music"
version = "0.2.0"
description = "Local-first piano composition, Logic handoff, and private MLX LoRA workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
train = ["mlx-lm[train]==0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[project.scripts]
sovereign-music = "sovereign_music.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
